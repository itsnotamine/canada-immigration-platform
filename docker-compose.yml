services:
  postgres:
    image: postgres:15
    container_name: canada_postgres
    restart: always
    environment:
      POSTGRES_DB: canada_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: node:18
    container_name: canada_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run develop"
    ports:
      - "1337:1337"
    depends_on:
      - postgres
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: canada_platform
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

  frontend:
    image: node:18
    container_name: canada_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: